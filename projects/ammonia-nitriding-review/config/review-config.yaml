review_project:
  name: "김영광_암모니아질화_리뷰논문"
  document_type: "리뷰 논문"
  topic_request: "기존에 만들던 암모니아 주제 그대로 가져가며 수정"
  selected_topic: "암모니아 에너지 시스템에서의 원치 않는 질화 및 질화부식"
  topic_rationale: "2024-2026년 문헌에서 암모니아 크래킹, 암모니아 연소, 가스터빈, 선박엔진, 저장·수송 인프라의 재료 신뢰성 문제가 집중적으로 증가하고 있음."
  target_pages: 50
  page_count_policy:
    min_pages: 50
    max_pages_exclusive: 100
    exact_target_required: false
    allow_over_target: true
    confirm_before_generation: true
    user_confirmed: true
  language: "ko"
  citation_style: "numeric"
  format_scope: "서울대 재료공학 기본 양식"
  image_mode: "mixed"
  image_policy: "원문 그림을 가져와 출처를 남기고, 필요하면 생성 그림을 추가"
  deliverables: ["docx", "pdf"]
  placeholder_draft_approved: false

metadata:
  author: "김영광"
  korean_title: "암모니아 에너지 시스템에서의 원치 않는 질화 및 질화부식: 기구, 합금 의존성, 억제 전략에 관한 리뷰"
  english_title: "Unwanted Nitriding and Nitridation Corrosion in Ammonia Energy Systems: Mechanisms, Alloy Dependence, and Mitigation Strategies"
  degree_name: ""
  school_name: "서울대학교 대학원"
  department: ""
  major: ""
  advisor: ""
  submission_month: ""
  approval_month: ""
  acknowledgements: false
  committee:
    chair: "이명규"
    vice_chair: "한흥남"
    members:
      - role: "외부심사위원"
        name: "김동익"

preflight:
  unresolved_questions: []

layout_rules:
  front_matter:
    page_1: "cover"
    page_2: "approval"
    page_3: "korean_abstract"
    omit_separate_submission_page: true
    omit_acknowledgements_by_default: true
  typography:
    korean_font: "Batang"
    english_font: "Times New Roman"
    font_color: "000000"
    allow_colored_text: false
  figures_and_tables:
    isolated_pages: true
    allowed_content_on_item_page: ["figure_or_table", "caption"]
    default_items_per_page: 1
    max_items_per_page_when_small: 2
    never_split_across_pages: true
    never_clip_or_crop: true
    center_single_item_group: true
    center_two_item_group: true
    two_item_gap_min_pt: 12
    pdf_center_tolerance_ratio: 0.08
    pdf_edge_margin_min_ratio: 0.02
